services:
  # qBittorrent, gestión de descargas
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    volumes:
      - ./qbittorrent-config:/config
      - ${PATH_DOWNLOADS}:/downloads
      - ${PATH_MOVIES}:/movies
      - ${PATH_TVSHOWS}:/tvshows
      - ${PATH_MUSIC}:/music
    ports:
      - 8080:8080
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped
    networks:
      - jelly_network

  # Radarr, gestión de películas
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - ./radarr-config:/config
      - ${PATH_DOWNLOADS}:/downloads
      - ${PATH_MOVIES}:/movies
    ports:
      - 7878:7878
    restart: unless-stopped
    depends_on:
      - qbittorrent
    networks:
      - jelly_network

  # Sonarr, gestión de series
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - ./sonarr-config:/config
      - ${PATH_DOWNLOADS}:/downloads
      - ${PATH_TVSHOWS}:/tvshows
    ports:
      - 8989:8989
    restart: unless-stopped
    depends_on:
      - qbittorrent
    networks:
      - jelly_network

  # Lidarr, gestión de música
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - ./lidarr-config:/config
      - ${PATH_DOWNLOADS}:/downloads
      - ${PATH_MUSIC}:/music
    ports:
      - 8686:8686
    restart: unless-stopped
    depends_on:
      - qbittorrent
    networks:
      - jelly_network

  # Bazarr, gestión de subtítulos
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - ./bazarr-config:/config
      - ${PATH_DOWNLOADS}:/downloads
      - ${PATH_MOVIES}:/movies
      - ${PATH_TVSHOWS}:/tvshows
      - ${PATH_MUSIC}:/music
    ports:
      - 6767:6767
    restart: unless-stopped
    depends_on:
      - radarr
      - sonarr
    networks:
      - jelly_network

  # Prowlarr, gestión de indexadores
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - ./prowlarr-config:/config
    ports:
      - 9696:9696
    restart: unless-stopped
    networks:
      - jelly_network

  # Jellyfin, servidor multimedia
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - JELLYFIN_PublishedServerUrl=http://192.168.0.5
    volumes:
      - ./jellyfin-config:/config
      - ./jellyfin-cache:/cache
      - ${PATH_MOVIES}:/movies
      - ${PATH_TVSHOWS}:/tvshows
      - ${PATH_MUSIC}:/music
    ports:
      - 8096:8096
      - 8920:8920
      - 7359:7359/udp
      - 1900:1900/udp
    restart: unless-stopped
    networks:
      - jelly_network

  # Jellyseerr, gestión de solicitudes
  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    environment:
      - LOG_LEVEL=debug
      - TZ=${TZ}
    ports:
      - 5055:5055
    volumes:
      - ./jellyseerr-config:/app/config
    restart: unless-stopped
    depends_on:
      - radarr
      - sonarr
      - lidarr
    networks:
      - jelly_network

networks:
  jelly_network:
    external: false
